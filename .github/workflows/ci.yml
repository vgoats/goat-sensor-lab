name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.37.4
      - run: python3 tools/verify_samples_schema.py
      - run: python3 -m unittest discover -s tools/tests -v
      - run: check-jsonschema --check-metaschema schema/*.schema.json
      - run: check-jsonschema --schemafile schema/reference-manifest-v1.schema.json references/manifest.json
      - run: check-jsonschema --schemafile schema/evidence-ledger-v1.schema.json references/evidence-ledger.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew testDebugUnitTest assembleDebug

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.4"
          enable-cache: true
      - run: uv sync --directory analysis --extra dev --frozen
      - run: uv run --directory analysis ruff check .
      - run: uv run --directory analysis pytest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install platformio==6.1.19
      - run: platformio run -d firmware/xiao-nrf52840-sense
